server:
  port: 8081
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
spring:
  application:
    name: aobp-bff
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  session:
    store-type: redis
    timeout: 30m
  security:
    oauth2:
      client:
        registration:
          aobp:
            provider: keycloak
            client-id: ${OIDC_CLIENT_ID:aobp-bff}
            client-secret: ${OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8085/realms/aobp}
services:
  flight: ${FLIGHT_URL:http://localhost:8091}
  workflow: ${WORKFLOW_URL:http://localhost:8092}
