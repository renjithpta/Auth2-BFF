server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: __Host-AOBPSESSION
        secure: true
        http-only: true
        same-site: lax
        path: /
spring:
  data:
    redis:
      url: ${REDIS_URL}
      ssl:
        enabled: true
  security:
    oauth2:
      client:
        registration:
          aobp:
            client-secret: ${OIDC_CLIENT_SECRET}
        provider:
          keycloak:
            issuer-uri: ${OIDC_ISSUER_URI}
services:
  flight: ${FLIGHT_URL}
  workflow: ${WORKFLOW_URL}
management:
  endpoint:
    health:
      probes:
        enabled: true
