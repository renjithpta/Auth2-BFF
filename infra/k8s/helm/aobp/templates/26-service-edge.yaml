{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "edge",
    "namespace": {{ .Release.Namespace | quote }}
  },
  "spec": {
    "selector": {
      "app": "edge"
    },
    "ports": [
      {
        "name": "http",
        "port": 8080,
        "targetPort": 8080
      }
    ]
  }
}
