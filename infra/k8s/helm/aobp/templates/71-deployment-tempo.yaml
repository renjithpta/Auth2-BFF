{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "tempo",
    "namespace": {{ .Release.Namespace | quote }}
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "tempo"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "tempo"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "name": "tempo",
            "image": "grafana/tempo:2.8.2",
            "ports": [
              {
                "containerPort": 3200,
                "name": "http"
              },
              {
                "containerPort": 4318,
                "name": "otlp"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "memory": "1Gi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "args": [
              "-config.file=/etc/tempo.yml"
            ],
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/etc/tempo.yml",
                "subPath": "tempo.yml",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "config",
            "configMap": {
              "name": "tempo-config"
            }
          }
        ]
      }
    }
  }
}
