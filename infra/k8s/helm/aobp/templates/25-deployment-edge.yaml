{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "edge",
    "namespace": {{ .Release.Namespace | quote }}
  },
  "spec": {
    "replicas": {{ .Values.replicaCount }},
    "selector": {
      "matchLabels": {
        "app": "edge"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "edge"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "terminationGracePeriodSeconds": 45,
        "containers": [
          {
            "name": "edge",
            "imagePullPolicy": {{ .Values.imagePullPolicy | quote }},
            "image": {{ index .Values.images "edge" | default "nginxinc/nginx-unprivileged:1.28-alpine" | quote }},
            "ports": [
              {
                "containerPort": 8080,
                "name": "http"
              }
            ],
            "resources": {{ toJson .Values.resources }},
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "volumeMounts": [
              {
                "name": "edge-config",
                "mountPath": "/etc/nginx/conf.d/default.conf",
                "subPath": "default.conf",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "edge-config",
            "configMap": {
              "name": "edge-config"
            }
          }
        ]
      }
    }
  }
}
