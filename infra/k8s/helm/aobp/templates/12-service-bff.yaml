{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "bff",
    "namespace": {{ .Release.Namespace | quote }}
  },
  "spec": {
    "selector": {
      "app": "bff"
    },
    "ports": [
      {
        "name": "http",
        "port": 8081,
        "targetPort": 8081
      },
      {
        "name": "management",
        "port": 9090,
        "targetPort": 9090
      }
    ]
  }
}
