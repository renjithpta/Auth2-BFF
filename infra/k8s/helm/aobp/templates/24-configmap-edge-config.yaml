{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "edge-config",
    "namespace": {{ .Release.Namespace | quote }}
  },
  "data": {
    "default.conf": "server {\n listen 8080;\n server_tokens off;\n client_max_body_size 1m;\n add_header X-Content-Type-Options nosniff always;\n add_header Referrer-Policy same-origin always;\n add_header Content-Security-Policy \"default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:8088; frame-ancestors 'none'; base-uri 'self'\" always;\n location /mfes/flight/ { proxy_pass http://flight-mfe:8080/; }\n location /mfes/workflow/ { proxy_pass http://workflow-mfe:8080/; }\n location ~ ^/(bff|oauth2|login|logout)(/|$) {\n  proxy_pass http://gateway:8080;\n  proxy_http_version 1.1;\n  proxy_set_header Upgrade $http_upgrade;\n  proxy_set_header Connection \"upgrade\";\n  proxy_set_header Host $http_host;\n  proxy_set_header X-Forwarded-For $remote_addr;\n  proxy_read_timeout 75s;\n }\n location /api/ { proxy_pass http://gateway:8080; proxy_set_header Authorization $http_authorization; }\n location / { proxy_pass http://shell:8080; }\n}\n"
  }
}
