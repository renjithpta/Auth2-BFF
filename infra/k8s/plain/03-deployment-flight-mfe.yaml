apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-mfe
  namespace: aobp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flight-mfe
  template:
    metadata:
      labels:
        app: flight-mfe
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: flight-mfe
        image: aobp/flight-mfe:demo
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
