apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: aobp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
      - name: bff
        image: aobp/bff:demo
        ports:
        - containerPort: 8081
          name: http
        - containerPort: 9090
          name: management
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
        env:
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: aobp-runtime
              key: OIDC_CLIENT_SECRET
        - name: TOKEN_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: aobp-runtime
              key: TOKEN_ENCRYPTION_KEY
        envFrom:
        - configMapRef:
            name: bff-config
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: management
          periodSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: management
          periodSeconds: 5
          failureThreshold: 3
