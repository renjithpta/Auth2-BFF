server {
 listen 8080;
 server_tokens off;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:8088; frame-ancestors 'none'; base-uri 'self'" always;
 location /mfes/flight/ { proxy_pass http://flight-mfe:8080/; }
 location /mfes/workflow/ { proxy_pass http://workflow-mfe:8080/; }
 location ~ ^/(bff|oauth2|login|logout)(/|$) {
  proxy_pass http://gateway:8080;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_read_timeout 75s;
 }
 location /api/ { proxy_pass http://gateway:8080; proxy_set_header Authorization $http_authorization; }
 location / { proxy_pass http://shell:8080; }
}
