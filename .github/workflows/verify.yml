name: Verify reference
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash scripts/build.sh
      - run: python3 -m pip install -r scripts/requirements.txt && python3 scripts/validate.py
      - uses: azure/setup-helm@v4.3.0
      - run: helm lint infra/k8s/helm/aobp && helm template aobp infra/k8s/helm/aobp --namespace aobp-demo > /tmp/rendered.yaml
      - run: python3 scripts/configure.py && docker compose --env-file .env -f infra/docker/compose.yml config --quiet

  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/configure.py
      - run: bash scripts/compose.sh up -d --build
      - name: Wait for machine integration readiness
        run: |
          for attempt in $(seq 1 60); do
            if python3 scripts/atc-simulate.py; then exit 0; fi
            sleep 5
          done
          exit 1
      - run: python3 scripts/browser-flow-test.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npx playwright install --with-deps chromium --only-shell && npm run test:e2e
        working-directory: ui
      - if: always()
        run: bash scripts/compose.sh down
